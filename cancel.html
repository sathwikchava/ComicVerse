<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - ComicVerse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="http://fonts.googleapis.com/css?family=Cookie" rel="stylesheet" type="text/css">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .cancel-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px 20px;
        }

        .cancel-card {
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid rgba(255, 75, 75, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 75, 75, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }

        .icon-container {
            font-size: 4.5rem;
            color: #ff4b4b;
            margin-bottom: 20px;
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .cancel-card h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffffff;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .cancel-card h2 span {
            color: #ff4b4b;
        }

        .cancel-card p {
            color: #cccccc;
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .action-btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: greenyellow;
            color: #000000;
            border: none;
        }

        .btn-primary:hover {
            background: #adff2fdd;
            box-shadow: 0 0 15px rgba(173, 255, 47, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <header>
            <input type="checkbox" name="" id="chk1">
            <div class="logo">
                <h3>Comic<span>Verse</span></h3>
            </div>
            <ul>
                <li><a href="home.html" class="nav_items">Home</a></li>
                <li><a href="movies.html" class="nav_items">Movies</a></li>
                <li><a href="char.html" class="nav_items">Characters</a></li>
                <li><a href="index.html" class="nav_items">Store</a></li>
                <li>
                    <a href="cart.html">
                        <div class="cart">
                            <div id="cart_amount" class="nav_items">🛒</div>
                        </div>
                    </a>
                </li>
            </ul>
        </header>
    </div>

    <div class="cancel-container">
        <div class="cancel-card">
            <div class="icon-container">
                <i class="fa-solid fa-circle-xmark"></i>
            </div>
            <h2>Checkout<span> Cancelled</span></h2>
            <p>The transaction was aborted or failed. No charges were made. If you experienced a payment failure, please try again or contact support.</p>

            <div class="btn-group">
                <a href="cart.html" class="action-btn btn-primary">Return to Cart</a>
                <a href="index.html" class="action-btn btn-secondary">Go to Store</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="https://kit.fontawesome.com/a5b152ec93.js" crossorigin="anonymous"></script>
</body>
</html>
