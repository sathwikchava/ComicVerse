# Netlify Configuration File

[build]
  # Serve from the root folder (default for static multi-page HTML site)
  publish = "."

[build.processing.html]
  pretty_urls = true

# Clean URLs Redirects (Internally rewrites /path to /path.html)
[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/movies"
  to = "/movies.html"
  status = 200

[[redirects]]
  from = "/char"
  to = "/char.html"
  status = 200

# Proxy Rules to route API requests to the Render backend server
# This prevents CORS errors completely by proxying /api/ requests to the Render URL
[[redirects]]
  from = "/api/*"
  to = "https://comicverse-ooir.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"
